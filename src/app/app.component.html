<h1>Frecuencia de Audio: {{ frequency | number:'1.0-1' }} Hz</h1>

<p *ngIf="isCapturing">Frecuencia Máxima: {{ frequency | number:'1.0-1' }}</p>

<!-- Barra de visualización -->
<div style="background: #ddd; width: 100%; height: 30px; border-radius: 10px; overflow: hidden; margin: 1rem 0;" *ngIf="isCapturing">
  <div
    [style.width.%]="getBarWidth(frequency)"
    style="height: 100%; background-color: #4caf50; transition: width 0.2s ease;"
  ></div>
</div>
<p *ngIf="frequency < 100">🎤 Esperando señal estable...</p>
<button (click)="startCapture()" [disabled]="isCapturing">Iniciar Captura</button>
<button (click)="stopCapture()" [disabled]="!isCapturing">Detener Captura</button>
